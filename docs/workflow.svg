<text x="612" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="start">A subset of the file:</text>
<text x="612" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">a view with the</text>
<text x="612" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">elements you need.</text>
<text x="612" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">Every new version of</text>
<text x="612" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">the file updates it.</text>
<text x="832" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">Query the latest version</text>
<text x="832" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">against the previous one:</text>
<text x="832" y="398" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#FFFF00" text-anchor="start">exchangeByVersions</text>
