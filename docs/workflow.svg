<text x="68" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">Version 5 → 6: four elements changed.</text>
<text x="68" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">Only one is in the exchange.</text>
<text x="832" y="202" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="bold" fill="#FFFF00" text-anchor="start">dm.version.added</text>
<text x="832" y="230" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#D5D5CB" text-anchor="start">POST /webhook</text>
