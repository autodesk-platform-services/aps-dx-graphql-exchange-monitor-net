<text x="72" y="636" font-family="Menlo, Consolas, monospace" font-size="56" font-weight="bold" fill="#666666" text-anchor="start">[ ]</text>
<text x="198" y="608" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#D5D5CB" text-anchor="start">Nothing changed in the parts you</text>
<text x="198" y="632" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#D5D5CB" text-anchor="start">care about. The new version did</text>
<text x="198" y="656" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#D5D5CB" text-anchor="start">not touch the exchange.</text>
<text x="656" y="562" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="start">The result has elements</text>
