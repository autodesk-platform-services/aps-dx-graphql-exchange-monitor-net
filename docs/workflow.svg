<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 724" width="1200" height="724" role="img" aria-labelledby="t d">
<title id="t">Exchange Monitor workflow</title>
<desc id="d">A Revit file gets a new version, the exchange built from a subset of the file updates itself, and a webhook on the exchange fires. Querying the exchange tells you whether the elements you care about changed: an empty result means no, a table of elements means yes.</desc>
<rect width="1200" height="724" fill="#000000"/>
<text x="48" y="64" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="start">From “the file changed” to “this part changed”</text>
<text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#D5D5CB" text-anchor="start">A webhook tells you something happened. An exchange tells you whether it matters to you.</text>
