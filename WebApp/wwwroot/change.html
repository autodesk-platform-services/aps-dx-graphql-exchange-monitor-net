<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="https://cdn.autodesk.io/favicon.ico">
    <link rel="stylesheet" href="/main.css">
    <title>Exchange Monitor: Change</title>
</head>

<body class="no-sidebar">
    <header id="header" class="hud-panel cut">
        <img class="logo" src="https://cdn.autodesk.io/logo/black/stacked.png" alt="Autodesk Platform Services">
        <div class="title">
            <div class="tag">WEBHOOK &bull; DATA EXCHANGE &bull; LIVE</div>
            <h1>Exchange Monitor</h1>
            <div class="sub">Signed in as: <b id="user">&ndash;</b></div>
        </div>
        <nav>
            <a href="/">Setup</a>
            <a href="/watchers">Watchers</a>
        </nav>
        <button id="login" style="visibility: hidden;">Login</button>
    </header>
    <section id="main" class="hud-panel">
        <div class="content">
            <h2>What changed in the exchange</h2>
            <p class="lead" id="subject">Loading...</p>
            <div class="actions">
                <a href="/watchers">&laquo; Watchers</a>
                <button id="check" class="primary" disabled>Check changes</button>
                <button id="details-toggle" hidden>Webhook call details</button>
                <span class="hint" id="trigger">Waiting for a webhook call...</span>
            </div>
            <div id="details" class="details" hidden></div>
            <div id="verdict" class="verdict" hidden></div>
            <table id="changes" hidden>
                <thead>
                    <tr><th>Element name</th><th>Operation</th></tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </section>
    <script src="/change.js" type="module"></script>
</body>

</html>
